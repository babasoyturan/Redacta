name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-services:
    name: Test Java services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :document-service:test :authentication-service:test :anonymization-service:test

      - name: Build Java Docker images
        run: |
          docker build -f document-service/Dockerfile . -t redacta-document-service:${{ github.sha }}
          docker build -f authentication-service/Dockerfile . -t redacta-authentication-service:${{ github.sha }}
          docker build -f anonymization-service/Dockerfile . -t redacta-anonymization-service:${{ github.sha }}

  genai-service:
    name: Test GenAI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/genai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/genai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t redacta-genai-service:${{ github.sha }} .
