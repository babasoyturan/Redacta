name: Environment Control

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to manage
        required: true
        type: choice
        options:
          - development
          - production
      action:
        description: Operation to run
        required: true
        type: choice
        options:
          - status
          - start
          - stop

permissions:
  id-token: write
  contents: read

concurrency:
  group: environment-control-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  aks:
    name: ${{ inputs.action }} ${{ inputs.environment }} AKS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'production-infrastructure' || 'development-infrastructure' }}
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT }}
      AZURE_CLIENT_ID_TERRAFORM_PRODUCTION: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_PRODUCTION }}
    steps:
      - name: Select target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.environment }}" in
            development)
              echo "client_id=${AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT}" >> "$GITHUB_OUTPUT"
              echo "resource_group=rg-redacta-development" >> "$GITHUB_OUTPUT"
              echo "cluster_name=aks-redacta-dev-swec" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "client_id=${AZURE_CLIENT_ID_TERRAFORM_PRODUCTION}" >> "$GITHUB_OUTPUT"
              echo "resource_group=rg-redacta-production" >> "$GITHUB_OUTPUT"
              echo "cluster_name=aks-redacta-prod-swec" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: ${{ inputs.environment }}" >&2
              exit 1
              ;;
          esac

      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=false
          for value in "${{ steps.target.outputs.client_id }}" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID"; do
            if [ -z "$value" ]; then
              missing=true
            fi
          done

          if [ "$missing" = true ]; then
            echo "Required Azure OIDC variables are not configured." >&2
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ steps.target.outputs.client_id }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Show AKS status before action
        shell: bash
        run: |
          if ! az aks show \
            --resource-group "${{ steps.target.outputs.resource_group }}" \
            --name "${{ steps.target.outputs.cluster_name }}" \
            --query "{name:name, powerState:powerState.code, provisioningState:provisioningState, kubernetesVersion:kubernetesVersion}" \
            --output table; then
            if [ "${{ inputs.action }}" = "status" ]; then
              echo "AKS cluster is not deployed yet for ${{ inputs.environment }}."
              exit 0
            fi

            exit 1
          fi

      - name: Stop AKS
        if: inputs.action == 'stop'
        run: |
          az aks stop \
            --resource-group "${{ steps.target.outputs.resource_group }}" \
            --name "${{ steps.target.outputs.cluster_name }}"

      - name: Start AKS
        if: inputs.action == 'start'
        run: |
          az aks start \
            --resource-group "${{ steps.target.outputs.resource_group }}" \
            --name "${{ steps.target.outputs.cluster_name }}"

      - name: Show AKS status after action
        if: inputs.action != 'status'
        shell: bash
        run: |
          az aks show \
            --resource-group "${{ steps.target.outputs.resource_group }}" \
            --name "${{ steps.target.outputs.cluster_name }}" \
            --query "{name:name, powerState:powerState.code, provisioningState:provisioningState, kubernetesVersion:kubernetesVersion}" \
            --output table
