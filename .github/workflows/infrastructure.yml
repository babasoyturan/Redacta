name: Infrastructure CI/CD

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "terraform/**"
      - "scripts/bootstrap-tfstate.ps1"
      - "scripts/bootstrap-cloud-access.ps1"
      - "scripts/update-cloud-values.mjs"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "terraform/**"
      - "scripts/bootstrap-tfstate.ps1"
      - "scripts/bootstrap-cloud-access.ps1"
      - "scripts/update-cloud-values.mjs"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: Terraform stack to plan
        required: true
        type: choice
        options:
          - shared
          - development
          - production

permissions:
  contents: write
  id-token: write

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate stacks
        shell: bash
        run: |
          set -euo pipefail
          for stack in shared development production; do
            terraform -chdir="terraform/stacks/${stack}" init -backend=false
            terraform -chdir="terraform/stacks/${stack}" validate
          done

      - name: Validate cloud values helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/redacta-terraform-output.json <<'JSON'
          {
            "resource_group_name": {"value": "rg-redacta-development"},
            "documents_storage_account_name": {"value": "stredactadev7t9"},
            "documents_share_name": {"value": "redacta-documents"},
            "sql_server_fqdn": {"value": "sql-redacta-dev-7t9.database.windows.net"},
            "key_vault_name": {"value": "kv-redacta-dev-swec"},
            "workload_identity_client_ids": {
              "value": {
                "documentService": "11111111-1111-1111-1111-111111111111",
                "authenticationService": "22222222-2222-2222-2222-222222222222",
                "anonymizationService": "33333333-3333-3333-3333-333333333333",
                "genaiService": "44444444-4444-4444-4444-444444444444",
                "keycloak": "55555555-5555-5555-5555-555555555555"
              }
            }
          }
          JSON

          node scripts/update-cloud-values.mjs \
            --environment development \
            --outputs-file /tmp/redacta-terraform-output.json \
            --file /tmp/redacta-values.yaml \
            --tenant-id 00000000-0000-0000-0000-000000000000 \
            --acr-login-server acrredacta7t9.azurecr.io \
            --host dev.redacta.site

          grep -q "sql-redacta-dev-7t9.database.windows.net" /tmp/redacta-values.yaml

      - name: Trivy Terraform IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  plan:
    name: Plan ${{ matrix.stack }}
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    environment: ${{ matrix.stack == 'production' && 'production-infrastructure' || 'development-infrastructure' }}
    strategy:
      fail-fast: false
      matrix:
        stack:
          - shared
          - development
          - production
    env:
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID_TERRAFORM_SHARED: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_SHARED }}
      AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT }}
      AZURE_CLIENT_ID_TERRAFORM_PRODUCTION: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_PRODUCTION }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_dns_zone_name: ${{ vars.DNS_ZONE_NAME }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_api_server_authorized_ip_ranges: '["185.91.210.72/32","188.253.210.100/32","188.253.216.100/32"]'
      TF_VAR_platform_admin_object_ids: '["0000df1f-acd9-43ee-98a3-addd4f65b744","04e638d3-6526-40f6-8923-00450440e6dc","5475327e-ea6a-43fb-8c5b-6ff0ca8d5343","dc4471e7-b978-419e-b43d-52fca9c97bd0"]'
      TF_VAR_sql_administrator_login_password: ${{ matrix.stack == 'production' && secrets.SQL_ADMIN_PASSWORD_PRODUCTION || secrets.SQL_ADMIN_PASSWORD_DEVELOPMENT }}
    steps:
      - name: Skip non-selected workflow dispatch stacks
        if: github.event_name == 'workflow_dispatch' && inputs.stack != matrix.stack
        run: echo "Stack ${{ matrix.stack }} was not selected."

      - name: Checkout
        if: github.event_name != 'workflow_dispatch' || inputs.stack == matrix.stack
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: github.event_name != 'workflow_dispatch' || inputs.stack == matrix.stack
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Select Azure identity
        if: github.event_name != 'workflow_dispatch' || inputs.stack == matrix.stack
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.stack }}" in
            shared)
              client_id="${AZURE_CLIENT_ID_TERRAFORM_SHARED}"
              ;;
            development)
              client_id="${AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT}"
              ;;
            production)
              client_id="${AZURE_CLIENT_ID_TERRAFORM_PRODUCTION}"
              ;;
            *)
              echo "Unsupported stack."
              exit 1
              ;;
          esac

          missing=false
          for value in "$client_id" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID" "$TFSTATE_STORAGE_ACCOUNT_NAME" "$AZURE_LOCATION"; do
            if [ -z "$value" ]; then
              missing=true
            fi
          done

          if [ "${{ matrix.stack }}" = "shared" ]; then
            for value in "$TF_VAR_acr_name"; do
              if [ -z "$value" ]; then
                missing=true
              fi
            done
          else
            for value in "$TF_VAR_api_server_authorized_ip_ranges" "$TF_VAR_sql_administrator_login_password"; do
              if [ -z "$value" ]; then
                missing=true
              fi
            done
          fi

          if [ "$missing" = true ]; then
            echo "::notice::Terraform plan skipped because required Azure or Terraform variables are not configured."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Azure login
        if: steps.identity.outputs.can_run == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ steps.identity.outputs.client_id }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        if: steps.identity.outputs.can_run == 'true'
        env:
          ARM_CLIENT_ID: ${{ steps.identity.outputs.client_id }}
        run: |
          terraform -chdir="terraform/stacks/${{ matrix.stack }}" init \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan
        if: steps.identity.outputs.can_run == 'true'
        env:
          ARM_CLIENT_ID: ${{ steps.identity.outputs.client_id }}
        run: |
          set -o pipefail
          terraform -chdir="terraform/stacks/${{ matrix.stack }}" plan -no-color | tee "terraform-plan-${{ matrix.stack }}.txt"

      - name: Upload Terraform plan artifact
        if: steps.identity.outputs.can_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.stack }}
          path: terraform-plan-${{ matrix.stack }}.txt

  apply-development-shared:
    name: Apply shared infrastructure for development line
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment: development-infrastructure
    env:
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID_TERRAFORM_SHARED: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_SHARED }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_SHARED }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_dns_zone_name: ${{ vars.DNS_ZONE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check shared configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          missing=false
          for value in "$AZURE_CLIENT_ID_TERRAFORM_SHARED" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID" "$TFSTATE_STORAGE_ACCOUNT_NAME" "$AZURE_LOCATION" "$TF_VAR_acr_name"; do
            if [ -z "$value" ]; then
              missing=true
            fi
          done

          if [ "$missing" = true ]; then
            echo "::notice::Shared apply skipped because required Azure or Terraform variables are not configured."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Azure login
        if: steps.config.outputs.can_run == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_TERRAFORM_SHARED }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        if: steps.config.outputs.can_run == 'true'
        run: |
          terraform -chdir="terraform/stacks/shared" init \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform apply
        if: steps.config.outputs.can_run == 'true'
        run: terraform -chdir="terraform/stacks/shared" apply -auto-approve -no-color

  apply-development:
    name: Apply development infrastructure
    runs-on: ubuntu-latest
    needs:
      - validate
      - apply-development-shared
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment: development-infrastructure
    env:
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      DEVELOPMENT_HOSTNAME: ${{ vars.DEVELOPMENT_HOSTNAME }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_api_server_authorized_ip_ranges: '["185.91.210.72/32","188.253.210.100/32","188.253.216.100/32"]'
      TF_VAR_platform_admin_object_ids: '["0000df1f-acd9-43ee-98a3-addd4f65b744","04e638d3-6526-40f6-8923-00450440e6dc","5475327e-ea6a-43fb-8c5b-6ff0ca8d5343","dc4471e7-b978-419e-b43d-52fca9c97bd0"]'
      TF_VAR_sql_administrator_login_password: ${{ secrets.SQL_ADMIN_PASSWORD_DEVELOPMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check development configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          for value in "$AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID" "$TFSTATE_STORAGE_ACCOUNT_NAME" "$AZURE_LOCATION" "$ACR_LOGIN_SERVER" "$TF_VAR_api_server_authorized_ip_ranges" "$TF_VAR_sql_administrator_login_password"; do
            if [ -z "$value" ]; then
              missing=true
            fi
          done

          if [ "$missing" = true ]; then
            echo "::notice::Development apply skipped because required Azure or Terraform variables are not configured."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Azure login
        if: steps.config.outputs.can_run == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_TERRAFORM_DEVELOPMENT }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        if: steps.config.outputs.can_run == 'true'
        run: |
          terraform -chdir="terraform/stacks/development" init \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform apply
        if: steps.config.outputs.can_run == 'true'
        run: terraform -chdir="terraform/stacks/development" apply -auto-approve -no-color

      - name: Export development Terraform outputs
        if: steps.config.outputs.can_run == 'true'
        run: terraform -chdir="terraform/stacks/development" output -json > terraform-output.json

      - name: Update development Helm values from Terraform outputs
        if: steps.config.outputs.can_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          host="${DEVELOPMENT_HOSTNAME:-dev.redacta.site}"
          node scripts/update-cloud-values.mjs \
            --environment development \
            --outputs-file terraform-output.json \
            --file deploy/helm/redacta/values-cloud-development.yaml \
            --tenant-id "$AZURE_TENANT_ID" \
            --acr-login-server "$ACR_LOGIN_SERVER" \
            --host "$host"

      - name: Commit development Helm values
        if: steps.config.outputs.can_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_branch="${GITHUB_REF_NAME}"
          values_file="deploy/helm/redacta/values-cloud-development.yaml"
          generated_values="$(mktemp)"

          cp "$values_file" "$generated_values"
          git fetch origin "$target_branch"
          git checkout -B "$target_branch" "origin/$target_branch"
          cp "$generated_values" "$values_file"

          if git diff --quiet -- "$values_file"; then
            echo "$values_file already matches Terraform outputs."
            exit 0
          fi

          git config user.name "redacta-infra-bot"
          git config user.email "redacta-infra-bot[bot]@users.noreply.github.com"
          git add "$values_file"
          git commit -m "chore(gitops): update development cloud values"
          git push origin "$target_branch"

  apply-production:
    name: Apply production infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production-infrastructure
    env:
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID_TERRAFORM_PRODUCTION: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_PRODUCTION }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      PRODUCTION_HOSTNAME: ${{ vars.PRODUCTION_HOSTNAME }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_PRODUCTION }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_api_server_authorized_ip_ranges: '["185.91.210.72/32","188.253.210.100/32","188.253.216.100/32"]'
      TF_VAR_platform_admin_object_ids: '["0000df1f-acd9-43ee-98a3-addd4f65b744","04e638d3-6526-40f6-8923-00450440e6dc","5475327e-ea6a-43fb-8c5b-6ff0ca8d5343","dc4471e7-b978-419e-b43d-52fca9c97bd0"]'
      TF_VAR_sql_administrator_login_password: ${{ secrets.SQL_ADMIN_PASSWORD_PRODUCTION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check production configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          for value in "$AZURE_CLIENT_ID_TERRAFORM_PRODUCTION" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID" "$TFSTATE_STORAGE_ACCOUNT_NAME" "$AZURE_LOCATION" "$ACR_LOGIN_SERVER" "$TF_VAR_api_server_authorized_ip_ranges" "$TF_VAR_sql_administrator_login_password"; do
            if [ -z "$value" ]; then
              missing=true
            fi
          done

          if [ "$missing" = true ]; then
            echo "::notice::Production apply skipped because required Azure or Terraform variables are not configured."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Azure login
        if: steps.config.outputs.can_run == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_TERRAFORM_PRODUCTION }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        if: steps.config.outputs.can_run == 'true'
        run: |
          terraform -chdir="terraform/stacks/production" init \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform apply
        if: steps.config.outputs.can_run == 'true'
        run: terraform -chdir="terraform/stacks/production" apply -auto-approve -no-color

      - name: Export production Terraform outputs
        if: steps.config.outputs.can_run == 'true'
        run: terraform -chdir="terraform/stacks/production" output -json > terraform-output.json

      - name: Update production Helm values from Terraform outputs
        if: steps.config.outputs.can_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          host="${PRODUCTION_HOSTNAME:-redacta.site}"
          node scripts/update-cloud-values.mjs \
            --environment production \
            --outputs-file terraform-output.json \
            --file deploy/helm/redacta/values-cloud-production.yaml \
            --tenant-id "$AZURE_TENANT_ID" \
            --acr-login-server "$ACR_LOGIN_SERVER" \
            --host "$host"

      - name: Commit production Helm values
        if: steps.config.outputs.can_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_branch="${GITHUB_REF_NAME}"
          values_file="deploy/helm/redacta/values-cloud-production.yaml"
          generated_values="$(mktemp)"

          cp "$values_file" "$generated_values"
          git fetch origin "$target_branch"
          git checkout -B "$target_branch" "origin/$target_branch"
          cp "$generated_values" "$values_file"

          if git diff --quiet -- "$values_file"; then
            echo "$values_file already matches Terraform outputs."
            exit 0
          fi

          git config user.name "redacta-infra-bot"
          git config user.email "redacta-infra-bot[bot]@users.noreply.github.com"
          git add "$values_file"
          git commit -m "chore(gitops): update production cloud values"
          git push origin "$target_branch"
