name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/helm/redacta/Chart.yaml"
      - "deploy/helm/redacta/values.yaml"
      - "deploy/helm/redacta/values-gitops-local.yaml"
      - "deploy/helm/redacta/values.example.yaml"
      - "deploy/helm/redacta/templates/**"
      - ".github/workflows/backend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/helm/redacta/Chart.yaml"
      - "deploy/helm/redacta/values.yaml"
      - "deploy/helm/redacta/values-gitops-local.yaml"
      - "deploy/helm/redacta/values.example.yaml"
      - "deploy/helm/redacta/templates/**"
      - ".github/workflows/backend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect backend and Helm changes
    runs-on: ubuntu-latest
    outputs:
      document: ${{ steps.detect.outputs.document }}
      authentication: ${{ steps.detect.outputs.authentication }}
      anonymization: ${{ steps.detect.outputs.anonymization }}
      genai: ${{ steps.detect.outputs.genai }}
      helm: ${{ steps.detect.outputs.helm }}
      versions_helper: ${{ steps.detect.outputs.versions_helper }}
      backend_any: ${{ steps.detect.outputs.backend_any }}
      java_any: ${{ steps.detect.outputs.java_any }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            head="$(git rev-parse HEAD)"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          git diff --name-only "$base" "$head" | tee /tmp/backend-changed-files.txt

          document=false
          authentication=false
          anonymization=false
          genai=false
          helm=false
          versions_helper=false

          if grep -qE '^backend/document-service/' /tmp/backend-changed-files.txt; then document=true; fi
          if grep -qE '^backend/authentication-service/' /tmp/backend-changed-files.txt; then authentication=true; fi
          if grep -qE '^backend/anonymization-service/' /tmp/backend-changed-files.txt; then anonymization=true; fi
          if grep -qE '^backend/genai-service/' /tmp/backend-changed-files.txt; then genai=true; fi

          if grep -qE '^backend/(build\.gradle|settings\.gradle|gradlew|gradle/)' /tmp/backend-changed-files.txt; then
            document=true
            authentication=true
            anonymization=true
          fi

          if grep -qE '^deploy/helm/redacta/(Chart\.yaml|values\.yaml|values-gitops-local\.yaml|values\.example\.yaml|templates/)' /tmp/backend-changed-files.txt; then
            helm=true
          fi

          if grep -qE '^scripts/update-versions\.mjs' /tmp/backend-changed-files.txt; then
            versions_helper=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            document=true
            authentication=true
            anonymization=true
            genai=true
            helm=true
            versions_helper=true
          fi

          backend_any=false
          java_any=false
          if [ "$document" = true ] || [ "$authentication" = true ] || [ "$anonymization" = true ] || [ "$genai" = true ]; then backend_any=true; fi
          if [ "$document" = true ] || [ "$authentication" = true ] || [ "$anonymization" = true ]; then java_any=true; fi

          {
            echo "document=$document"
            echo "authentication=$authentication"
            echo "anonymization=$anonymization"
            echo "genai=$genai"
            echo "helm=$helm"
            echo "versions_helper=$versions_helper"
            echo "backend_any=$backend_any"
            echo "java_any=$java_any"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  java-validation:
    name: Validate affected Java services
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.java_any == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run affected Java tests
        shell: bash
        run: |
          set -euo pipefail
          tasks=()

          if [ "${{ needs.detect.outputs.document }}" = "true" ]; then
            tasks+=(":document-service:test")
          fi

          if [ "${{ needs.detect.outputs.authentication }}" = "true" ]; then
            tasks+=(":authentication-service:test")
          fi

          if [ "${{ needs.detect.outputs.anonymization }}" = "true" ]; then
            tasks+=(":anonymization-service:test")
          fi

          ./gradlew "${tasks[@]}"

      - name: Build affected Java service images
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.detect.outputs.document }}" = "true" ]; then
            docker build -f document-service/Dockerfile . -t redacta-document-service:validation
          fi

          if [ "${{ needs.detect.outputs.authentication }}" = "true" ]; then
            docker build -f authentication-service/Dockerfile . -t redacta-authentication-service:validation
          fi

          if [ "${{ needs.detect.outputs.anonymization }}" = "true" ]; then
            docker build -f anonymization-service/Dockerfile . -t redacta-anonymization-service:validation
          fi

  genai-validation:
    name: Validate GenAI service
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.genai == 'true'
    defaults:
      run:
        working-directory: backend/genai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/genai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build GenAI image
        run: docker build -t redacta-genai-service:validation .

  backend-quality:
    name: Backend quality and filesystem scans
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend_any == 'true'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarQube Cloud backend analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=redacta-backend
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

      - name: Skip SonarQube Cloud backend analysis
        if: env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == ''
        run: echo "SonarQube Cloud is skipped because SONAR_TOKEN or SONAR_ORGANIZATION is not configured."

      - name: Trivy backend filesystem secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: secret
          exit-code: "1"
          format: table

      - name: Trivy backend filesystem vulnerability report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  helm-validation:
    name: Validate Redacta Helm chart
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.helm == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deploy/helm/redacta -f deploy/helm/redacta/values-gitops-local.yaml -f deploy/helm/redacta/versions.yaml

      - name: Helm template
        run: helm template redacta deploy/helm/redacta -f deploy/helm/redacta/values-gitops-local.yaml -f deploy/helm/redacta/versions.yaml

  versions-helper-validation:
    name: Validate GitOps version helper
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.versions_helper == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate versions.yaml update helper
        run: |
          node scripts/update-versions.mjs \
            frontend=redacta-frontend:local \
            documentService=redacta-document-service:local \
            authenticationService=redacta-authentication-service:local \
            anonymizationService=redacta-anonymization-service:local \
            genaiService=redacta-genai-service:local

  publish-config:
    name: Check backend publish credentials
    runs-on: ubuntu-latest
    needs:
      - detect
      - java-validation
      - genai-validation
      - backend-quality
      - helm-validation
      - versions-helper-validation
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.backend_any == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    outputs:
      can_publish: ${{ steps.check.outputs.can_publish }}
    steps:
      - name: Check required publish credentials
        id: check
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITOPS_APP_ID: ${{ vars.GITOPS_APP_ID }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$GITOPS_APP_ID" ] && [ -n "$GITOPS_APP_PRIVATE_KEY" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend publish is skipped because Docker Hub or GitOps bot credentials are not configured."
          fi

  publish:
    name: Build, scan, and publish affected backend images
    runs-on: ubuntu-latest
    needs:
      - detect
      - publish-config
    if: needs.publish-config.outputs.can_publish == 'true'
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.short_sha }}-${{ github.run_number }}-${{ github.run_attempt }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build affected backend images
        shell: bash
        run: |
          set -euo pipefail
          : > backend-version-updates.txt

          if [ "${{ needs.detect.outputs.document }}" = "true" ]; then
            image="${DOCKERHUB_USERNAME}/redacta-document-service:${IMAGE_TAG}"
            docker build -f backend/document-service/Dockerfile backend -t "$image"
            echo "documentService=$image" >> backend-version-updates.txt
          fi

          if [ "${{ needs.detect.outputs.authentication }}" = "true" ]; then
            image="${DOCKERHUB_USERNAME}/redacta-authentication-service:${IMAGE_TAG}"
            docker build -f backend/authentication-service/Dockerfile backend -t "$image"
            echo "authenticationService=$image" >> backend-version-updates.txt
          fi

          if [ "${{ needs.detect.outputs.anonymization }}" = "true" ]; then
            image="${DOCKERHUB_USERNAME}/redacta-anonymization-service:${IMAGE_TAG}"
            docker build -f backend/anonymization-service/Dockerfile backend -t "$image"
            echo "anonymizationService=$image" >> backend-version-updates.txt
          fi

          if [ "${{ needs.detect.outputs.genai }}" = "true" ]; then
            image="${DOCKERHUB_USERNAME}/redacta-genai-service:${IMAGE_TAG}"
            docker build -f backend/genai-service/Dockerfile backend/genai-service -t "$image"
            echo "genaiService=$image" >> backend-version-updates.txt
          fi

      - name: Trivy document image scan
        if: needs.detect.outputs.document == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/redacta-document-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Trivy authentication image scan
        if: needs.detect.outputs.authentication == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/redacta-authentication-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Trivy anonymization image scan
        if: needs.detect.outputs.anonymization == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/redacta-anonymization-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Trivy GenAI image scan
        if: needs.detect.outputs.genai == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/redacta-genai-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Generate backend SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom

          while IFS='=' read -r component image; do
            [ -n "$component" ] || continue
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" aquasec/trivy:0.56.2 image --format cyclonedx --output "/sbom/${component}-${IMAGE_TAG}-sbom.cdx.json" "$image"
          done < backend-version-updates.txt

      - name: Upload backend SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ env.IMAGE_TAG }}-sboms
          path: sbom/*-sbom.cdx.json
          if-no-files-found: error

      - name: Push affected backend images
        shell: bash
        run: |
          set -euo pipefail

          while IFS='=' read -r component image; do
            [ -n "$component" ] || continue
            docker push "$image"
          done < backend-version-updates.txt

      - name: Upload backend version updates
        uses: actions/upload-artifact@v4
        with:
          name: backend-version-updates
          path: backend-version-updates.txt
          if-no-files-found: error

  update-gitops:
    name: Update backend GitOps versions
    runs-on: ubuntu-latest
    needs:
      - publish
    if: needs.publish.result == 'success'
    concurrency:
      group: redacta-gitops-writeback
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Checkout with GitOps bot token
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Download backend version updates
        uses: actions/download-artifact@v4
        with:
          name: backend-version-updates
          path: .

      - name: Update backend image versions
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node scripts/update-versions.mjs --updates-file backend-version-updates.txt

          if git diff --quiet -- deploy/helm/redacta/versions.yaml; then
            echo "versions.yaml already contains backend image versions."
            exit 0
          fi

          git config user.name "redacta-gitops-bot"
          git config user.email "redacta-gitops-bot[bot]@users.noreply.github.com"
          git add deploy/helm/redacta/versions.yaml
          git commit -m "chore(gitops): update backend image versions"
          git push origin main
