name: Backend CI/CD

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - "deploy/helm/redacta/Chart.yaml"
      - "deploy/helm/redacta/values.yaml"
      - "deploy/helm/redacta/values-cloud-development.yaml"
      - "deploy/helm/redacta/values-cloud-production.yaml"
      - "deploy/helm/redacta/versions.yaml"
      - "deploy/helm/redacta/templates/**"
      - ".github/workflows/backend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - "deploy/helm/redacta/Chart.yaml"
      - "deploy/helm/redacta/values.yaml"
      - "deploy/helm/redacta/values-cloud-development.yaml"
      - "deploy/helm/redacta/values-cloud-production.yaml"
      - "deploy/helm/redacta/versions.yaml"
      - "deploy/helm/redacta/templates/**"
      - ".github/workflows/backend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect backend and Helm changes
    runs-on: ubuntu-latest
    outputs:
      document: ${{ steps.detect.outputs.document }}
      authentication: ${{ steps.detect.outputs.authentication }}
      anonymization: ${{ steps.detect.outputs.anonymization }}
      genai: ${{ steps.detect.outputs.genai }}
      helm: ${{ steps.detect.outputs.helm }}
      versions_helper: ${{ steps.detect.outputs.versions_helper }}
      backend_any: ${{ steps.detect.outputs.backend_any }}
      java_any: ${{ steps.detect.outputs.java_any }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            head="$(git rev-parse HEAD)"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          git diff --name-only "$base" "$head" | tee /tmp/backend-changed-files.txt

          document=false
          authentication=false
          anonymization=false
          genai=false
          helm=false
          versions_helper=false

          if grep -qE '^backend/document-service/' /tmp/backend-changed-files.txt; then document=true; fi
          if grep -qE '^backend/authentication-service/' /tmp/backend-changed-files.txt; then authentication=true; fi
          if grep -qE '^backend/anonymization-service/' /tmp/backend-changed-files.txt; then anonymization=true; fi
          if grep -qE '^backend/genai-service/' /tmp/backend-changed-files.txt; then genai=true; fi

          if grep -qE '^backend/(build\.gradle|settings\.gradle|gradlew|gradle/)' /tmp/backend-changed-files.txt; then
            document=true
            authentication=true
            anonymization=true
          fi

          if grep -qE '^\.github/workflows/backend-ci-cd\.yml$' /tmp/backend-changed-files.txt; then
            document=true
            authentication=true
            anonymization=true
            genai=true
            helm=true
            versions_helper=true
          fi

          if grep -qE '^deploy/helm/redacta/(Chart\.yaml|values\.yaml|values-cloud-development\.yaml|values-cloud-production\.yaml|versions\.yaml|templates/)' /tmp/backend-changed-files.txt; then
            helm=true
          fi

          if grep -qE '^scripts/update-versions\.mjs' /tmp/backend-changed-files.txt; then
            versions_helper=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            document=true
            authentication=true
            anonymization=true
            genai=true
            helm=true
            versions_helper=true
          fi

          backend_any=false
          java_any=false
          if [ "$document" = true ] || [ "$authentication" = true ] || [ "$anonymization" = true ] || [ "$genai" = true ]; then backend_any=true; fi
          if [ "$document" = true ] || [ "$authentication" = true ] || [ "$anonymization" = true ]; then java_any=true; fi

          {
            echo "document=$document"
            echo "authentication=$authentication"
            echo "anonymization=$anonymization"
            echo "genai=$genai"
            echo "helm=$helm"
            echo "versions_helper=$versions_helper"
            echo "backend_any=$backend_any"
            echo "java_any=$java_any"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  java-validation:
    name: Validate affected Java services
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.java_any == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run affected Java tests
        shell: bash
        run: |
          set -euo pipefail
          tasks=()

          if [ "${{ needs.detect.outputs.document }}" = "true" ]; then
            tasks+=(":document-service:test")
          fi

          if [ "${{ needs.detect.outputs.authentication }}" = "true" ]; then
            tasks+=(":authentication-service:test")
          fi

          if [ "${{ needs.detect.outputs.anonymization }}" = "true" ]; then
            tasks+=(":anonymization-service:test")
          fi

          ./gradlew "${tasks[@]}"

      - name: Build affected Java service images
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.detect.outputs.document }}" = "true" ]; then
            docker build -f document-service/Dockerfile . -t redacta-document-service:validation
          fi

          if [ "${{ needs.detect.outputs.authentication }}" = "true" ]; then
            docker build -f authentication-service/Dockerfile . -t redacta-authentication-service:validation
          fi

          if [ "${{ needs.detect.outputs.anonymization }}" = "true" ]; then
            docker build -f anonymization-service/Dockerfile . -t redacta-anonymization-service:validation
          fi

  genai-validation:
    name: Validate GenAI service
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.genai == 'true'
    defaults:
      run:
        working-directory: backend/genai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/genai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build GenAI image
        run: docker build -t redacta-genai-service:validation .

  backend-quality:
    name: Backend quality and filesystem scans
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend_any == 'true'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SonarQube configuration
        id: sonar-config
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::warning::SONAR_TOKEN secret or SONAR_HOST_URL variable is missing. Backend SonarQube analysis will be skipped for this run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube backend analysis
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=redacta-backend
            -Dsonar.sources=.
            -Dsonar.tests=document-service/src/test,authentication-service/src/test,anonymization-service/src/test,genai-service/tests
            -Dsonar.exclusions=**/build/**,**/.gradle/**,**/__pycache__/**,**/.pytest_cache/**,**/src/test/**,genai-service/tests/**
            -Dsonar.qualitygate.wait=false

      - name: Trivy backend filesystem secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: secret
          exit-code: "1"
          format: table

      - name: Trivy backend filesystem vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  helm-validation:
    name: Validate Redacta Helm chart
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.helm == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint development
        run: helm lint deploy/helm/redacta -f deploy/helm/redacta/values-cloud-development.yaml -f deploy/helm/redacta/versions.yaml

      - name: Helm template development
        run: helm template redacta deploy/helm/redacta -f deploy/helm/redacta/values-cloud-development.yaml -f deploy/helm/redacta/versions.yaml

      - name: Helm lint production
        run: helm lint deploy/helm/redacta -f deploy/helm/redacta/values-cloud-production.yaml -f deploy/helm/redacta/versions.yaml

      - name: Helm template production
        run: helm template redacta deploy/helm/redacta -f deploy/helm/redacta/values-cloud-production.yaml -f deploy/helm/redacta/versions.yaml

  versions-helper-validation:
    name: Validate GitOps version helper
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.versions_helper == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate cloud version update helper
        run: |
          node scripts/update-versions.mjs \
            --file deploy/helm/redacta/versions.yaml \
            frontend=acrredacta7t9.azurecr.io/redacta-frontend:validation \
            documentService=acrredacta7t9.azurecr.io/redacta-document-service:validation \
            authenticationService=acrredacta7t9.azurecr.io/redacta-authentication-service:validation \
            anonymizationService=acrredacta7t9.azurecr.io/redacta-anonymization-service:validation \
            genaiService=acrredacta7t9.azurecr.io/redacta-genai-service:validation

  publish-config:
    name: Check backend publish credentials
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production-infrastructure' || 'development-infrastructure' }}
    needs:
      - detect
      - java-validation
      - genai-validation
      - backend-quality
      - helm-validation
      - versions-helper-validation
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.detect.outputs.backend_any == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Check required publish credentials
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          AZURE_CLIENT_ID_ACR_PUSH: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$ACR_NAME" ] || missing+=("ACR_NAME")
          [ -n "$ACR_LOGIN_SERVER" ] || missing+=("ACR_LOGIN_SERVER")
          [ -n "$AZURE_CLIENT_ID_ACR_PUSH" ] || missing+=("AZURE_CLIENT_ID_ACR_PUSH")
          [ -n "$AZURE_TENANT_ID" ] || missing+=("AZURE_TENANT_ID")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("AZURE_SUBSCRIPTION_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Backend publish credentials are missing: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "Backend publish credentials are configured."

  publish:
    name: Build, scan, and publish affected backend images
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production-infrastructure' || 'development-infrastructure' }}
    needs:
      - detect
      - publish-config
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.detect.outputs.backend_any == 'true' &&
      needs.publish-config.result == 'success'
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.short_sha }}-${{ github.run_number }}-${{ github.run_attempt }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build affected backend images
        shell: bash
        run: |
          set -euo pipefail
          : > backend-version-updates.txt

          if [ "${{ needs.detect.outputs.document }}" = "true" ]; then
            image="${ACR_LOGIN_SERVER}/redacta-document-service:${IMAGE_TAG}"
            docker build -f backend/document-service/Dockerfile backend -t "$image"
            echo "documentService=$image" >> backend-version-updates.txt
          fi

          if [ "${{ needs.detect.outputs.authentication }}" = "true" ]; then
            image="${ACR_LOGIN_SERVER}/redacta-authentication-service:${IMAGE_TAG}"
            docker build -f backend/authentication-service/Dockerfile backend -t "$image"
            echo "authenticationService=$image" >> backend-version-updates.txt
          fi

          if [ "${{ needs.detect.outputs.anonymization }}" = "true" ]; then
            image="${ACR_LOGIN_SERVER}/redacta-anonymization-service:${IMAGE_TAG}"
            docker build -f backend/anonymization-service/Dockerfile backend -t "$image"
            echo "anonymizationService=$image" >> backend-version-updates.txt
          fi

          if [ "${{ needs.detect.outputs.genai }}" = "true" ]; then
            image="${ACR_LOGIN_SERVER}/redacta-genai-service:${IMAGE_TAG}"
            docker build -f backend/genai-service/Dockerfile backend/genai-service -t "$image"
            echo "genaiService=$image" >> backend-version-updates.txt
          fi

      - name: Trivy document image scan
        if: needs.detect.outputs.document == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/redacta-document-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy authentication image scan
        if: needs.detect.outputs.authentication == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/redacta-authentication-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy anonymization image scan
        if: needs.detect.outputs.anonymization == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/redacta-anonymization-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy GenAI image scan
        if: needs.detect.outputs.genai == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/redacta-genai-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate backend SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom

          while IFS='=' read -r component image; do
            [ -n "$component" ] || continue
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" aquasec/trivy:0.56.2 image --format cyclonedx --output "/sbom/${component}-${IMAGE_TAG}-sbom.cdx.json" "$image"
          done < backend-version-updates.txt

      - name: Upload backend SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ env.IMAGE_TAG }}-sboms
          path: sbom/*-sbom.cdx.json
          if-no-files-found: error

      - name: Push affected backend images
        shell: bash
        run: |
          set -euo pipefail

          while IFS='=' read -r component image; do
            [ -n "$component" ] || continue
            docker push "$image"
          done < backend-version-updates.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign affected backend images
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail

          while IFS='=' read -r component image; do
            [ -n "$component" ] || continue
            cosign sign --yes "$image"
          done < backend-version-updates.txt

      - name: Attach backend SBOM attestations
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail

          while IFS='=' read -r component image; do
            [ -n "$component" ] || continue
            cosign attest --yes --type cyclonedx --predicate "sbom/${component}-${IMAGE_TAG}-sbom.cdx.json" "$image"
          done < backend-version-updates.txt

      - name: Upload backend version updates
        uses: actions/upload-artifact@v4
        with:
          name: backend-version-updates
          path: backend-version-updates.txt
          if-no-files-found: error

  update-gitops:
    name: Update backend GitOps versions
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production-infrastructure' || 'development-infrastructure' }}
    needs:
      - publish
    if: |
      always() &&
      needs.publish.result == 'success'
    concurrency:
      group: redacta-gitops-writeback
      cancel-in-progress: false
    steps:
      - name: Checkout for GitOps writeback
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend version updates
        uses: actions/download-artifact@v4
        with:
          name: backend-version-updates
          path: .

      - name: Update backend image versions
        shell: bash
        run: |
          set -euo pipefail
          target_branch="dev"
          versions_file="deploy/helm/redacta/versions.yaml"

          git fetch origin "$target_branch"
          git checkout "$target_branch"
          git pull --ff-only origin "$target_branch"
          node scripts/update-versions.mjs --file "$versions_file" --updates-file backend-version-updates.txt

          if git diff --quiet -- "$versions_file"; then
            echo "$versions_file already contains backend image versions."
            exit 0
          fi

          git config user.name "redacta-gitops-bot"
          git config user.email "redacta-gitops-bot[bot]@users.noreply.github.com"
          git add "$versions_file"
          git commit -m "chore(gitops): update backend image versions"
          git push origin "$target_branch"
