name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FRONTEND_IMAGE_NAME: redacta-frontend

jobs:
  detect:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            head="$(git rev-parse HEAD)"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          git diff --name-only "$base" "$head" | tee /tmp/frontend-changed-files.txt

          if grep -qE '^frontend/' /tmp/frontend-changed-files.txt || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend_changed == 'true'
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build validation
        run: npm run build

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=redacta-frontend
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

      - name: Skip SonarQube Cloud analysis
        if: env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == ''
        run: echo "SonarQube Cloud is skipped because SONAR_TOKEN or SONAR_ORGANIZATION is not configured."

      - name: Trivy filesystem secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: secret
          exit-code: "1"
          format: table

      - name: Trivy filesystem vulnerability report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  publish-config:
    name: Check frontend publish credentials
    runs-on: ubuntu-latest
    needs:
      - detect
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.frontend_changed == 'true'
    outputs:
      can_publish: ${{ steps.check.outputs.can_publish }}
    steps:
      - name: Check required publish credentials
        id: check
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITOPS_APP_ID: ${{ vars.GITOPS_APP_ID }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$GITOPS_APP_ID" ] && [ -n "$GITOPS_APP_PRIVATE_KEY" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend publish is skipped because Docker Hub or GitOps bot credentials are not configured."
          fi

  publish:
    name: Build, scan, and publish frontend image
    runs-on: ubuntu-latest
    needs:
      - detect
      - validate
      - publish-config
    if: needs.publish-config.outputs.can_publish == 'true'
    env:
      IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/redacta-frontend
      IMAGE_TAG: ${{ needs.detect.outputs.short_sha }}-${{ github.run_number }}-${{ github.run_attempt }}
    outputs:
      image_repository: ${{ steps.image-meta.outputs.image_repository }}
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image-meta
        run: |
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build exact frontend image
        run: docker build -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" frontend

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: frontend-${{ env.IMAGE_TAG }}-sbom.cdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ env.IMAGE_TAG }}-sbom
          path: frontend-${{ env.IMAGE_TAG }}-sbom.cdx.json
          if-no-files-found: error

      - name: Push exact frontend image
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

  update-gitops:
    name: Update frontend GitOps version
    runs-on: ubuntu-latest
    needs:
      - publish
    if: needs.publish.result == 'success'
    concurrency:
      group: redacta-gitops-writeback
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Checkout with GitOps bot token
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Update frontend image version
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node scripts/update-versions.mjs "frontend=${{ needs.publish.outputs.image_repository }}:${{ needs.publish.outputs.image_tag }}"

          if git diff --quiet -- deploy/helm/redacta/versions.yaml; then
            echo "versions.yaml already contains the frontend image version."
            exit 0
          fi

          git config user.name "redacta-gitops-bot"
          git config user.email "redacta-gitops-bot[bot]@users.noreply.github.com"
          git add deploy/helm/redacta/versions.yaml
          git commit -m "chore(gitops): update frontend image version"
          git push origin main
