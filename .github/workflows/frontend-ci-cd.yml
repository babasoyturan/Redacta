name: Frontend CI/CD

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "frontend/**"
      - "deploy/helm/redacta/values-cloud-development.yaml"
      - "deploy/helm/redacta/values-cloud-production.yaml"
      - "deploy/helm/redacta/versions.yaml"
      - ".github/workflows/frontend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "frontend/**"
      - "deploy/helm/redacta/values-cloud-development.yaml"
      - "deploy/helm/redacta/values-cloud-production.yaml"
      - "deploy/helm/redacta/versions.yaml"
      - ".github/workflows/frontend-ci-cd.yml"
      - "scripts/update-versions.mjs"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: frontend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FRONTEND_IMAGE_NAME: redacta-frontend

jobs:
  detect:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            head="$(git rev-parse HEAD)"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          git diff --name-only "$base" "$head" | tee /tmp/frontend-changed-files.txt

          if grep -qE '^(frontend/|\.github/workflows/frontend-ci-cd\.yml$|scripts/update-versions\.mjs$)' /tmp/frontend-changed-files.txt || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend_changed == 'true'
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build validation
        run: npm run build

      - name: Require SonarQube configuration
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: |
          echo "::error::Configure SONAR_TOKEN secret and SONAR_HOST_URL variable to run frontend SonarQube analysis."
          exit 1

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=redacta-frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.*,src/**/*.spec.*
            -Dsonar.exclusions=dist/**,node_modules/**,coverage/**,src/**/*.test.*,src/**/*.spec.*
            -Dsonar.qualitygate.wait=false

      - name: Trivy filesystem secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: secret
          exit-code: "1"
          format: table

      - name: Trivy filesystem vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  publish-config:
    name: Check frontend publish credentials
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production-infrastructure' || 'development-infrastructure' }}
    needs:
      - detect
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.detect.outputs.frontend_changed == 'true'
    steps:
      - name: Check required publish credentials
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          AZURE_CLIENT_ID_ACR_PUSH: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$ACR_NAME" ] || missing+=("ACR_NAME")
          [ -n "$ACR_LOGIN_SERVER" ] || missing+=("ACR_LOGIN_SERVER")
          [ -n "$AZURE_CLIENT_ID_ACR_PUSH" ] || missing+=("AZURE_CLIENT_ID_ACR_PUSH")
          [ -n "$AZURE_TENANT_ID" ] || missing+=("AZURE_TENANT_ID")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("AZURE_SUBSCRIPTION_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Frontend publish credentials are missing: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "Frontend publish credentials are configured."

  publish:
    name: Build, scan, and publish frontend image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production-infrastructure' || 'development-infrastructure' }}
    needs:
      - detect
      - validate
      - publish-config
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.detect.outputs.frontend_changed == 'true' &&
      needs.publish-config.result == 'success'
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_REPOSITORY: ${{ vars.ACR_LOGIN_SERVER }}/redacta-frontend
      IMAGE_TAG: ${{ needs.detect.outputs.short_sha }}-${{ github.run_number }}-${{ github.run_attempt }}
    outputs:
      image_repository: ${{ steps.image-meta.outputs.image_repository }}
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image-meta
        run: |
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_ACR_PUSH }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build exact frontend image
        run: docker build -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" frontend

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: frontend-${{ env.IMAGE_TAG }}-sbom.cdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ env.IMAGE_TAG }}-sbom
          path: frontend-${{ env.IMAGE_TAG }}-sbom.cdx.json
          if-no-files-found: error

      - name: Push exact frontend image
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

  update-gitops:
    name: Update frontend GitOps version
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production-infrastructure' || 'development-infrastructure' }}
    needs:
      - publish
    if: needs.publish.result == 'success'
    concurrency:
      group: redacta-gitops-writeback
      cancel-in-progress: false
    steps:
      - name: Checkout for GitOps writeback
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update frontend image version
        shell: bash
        run: |
          set -euo pipefail
          target_branch="dev"
          versions_file="deploy/helm/redacta/versions.yaml"

          git fetch origin "$target_branch"
          git checkout "$target_branch"
          git pull --ff-only origin "$target_branch"
          node scripts/update-versions.mjs --file "$versions_file" "frontend=${{ needs.publish.outputs.image_repository }}:${{ needs.publish.outputs.image_tag }}"

          if git diff --quiet -- "$versions_file"; then
            echo "$versions_file already contains the frontend image version."
            exit 0
          fi

          git config user.name "redacta-gitops-bot"
          git config user.email "redacta-gitops-bot[bot]@users.noreply.github.com"
          git add "$versions_file"
          git commit -m "chore(gitops): update frontend image version"
          git push origin "$target_branch"
