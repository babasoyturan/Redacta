apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: redacta-development
  namespace: argocd
spec:
  description: Development GitOps project for Redacta
  sourceRepos:
    - git@github.com:babasoyturan/Redacta.git
    - https://kyverno.github.io/kyverno/
  destinations:
    - namespace: redacta
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
