apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redacta-security-production
  namespace: argocd
spec:
  project: redacta-production
  source:
    repoURL: git@github.com:babasoyturan/Redacta.git
    targetRevision: main
    path: deploy/helm/redacta-security
    helm:
      releaseName: redacta-security
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
