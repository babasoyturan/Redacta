apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redacta-security-production
  namespace: argocd
spec:
  project: redacta-production
  source:
    repoURL: git@github.com:babasoyturan/Redacta.git
    targetRevision: main
    path: deploy/helm/redacta-security
    helm:
      releaseName: redacta-security
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      name: redacta-verify-signed-images
      jsonPointers:
        - /spec/rules/0/verifyImages/0/attestors/0/entries/0/keyless/signatureAlgorithm
        - /spec/rules/0/verifyImages/0/attestors/0/entries/1/keyless/signatureAlgorithm
        - /spec/rules/0/verifyImages/0/attestors/0/entries/2/keyless/signatureAlgorithm
        - /spec/rules/0/verifyImages/0/attestors/0/entries/3/keyless/signatureAlgorithm
      jqPathExpressions:
        - .spec.rules[].verifyImages[].attestors[].entries[].keyless.signatureAlgorithm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
