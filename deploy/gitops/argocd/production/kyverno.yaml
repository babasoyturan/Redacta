apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-production
  namespace: argocd
spec:
  project: redacta-production
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      releaseName: kyverno
      values: |
        admissionController:
          replicas: 1
          rbac:
            serviceAccount:
              annotations:
                azure.workload.identity/client-id: fdcf04b8-daf2-4809-886a-2b8cba0cc739
          podLabels:
            azure.workload.identity/use: "true"
          container:
            extraEnvVars:
              - name: AZURE_CLIENT_ID
                value: fdcf04b8-daf2-4809-886a-2b8cba0cc739
        backgroundController:
          enabled: false
        cleanupController:
          enabled: false
        reportsController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
