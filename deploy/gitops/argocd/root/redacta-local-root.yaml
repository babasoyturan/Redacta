apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redacta-local-root
  namespace: argocd
spec:
  project: redacta-local
  source:
    repoURL: git@github.com:babasoyturan/Redacta.git
    targetRevision: main
    path: deploy/gitops/argocd/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
