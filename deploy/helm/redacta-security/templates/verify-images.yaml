{{- if .Values.imageVerification.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .Values.imageVerification.policyName | quote }}
  labels:
    app.kubernetes.io/name: redacta-security
    app.kubernetes.io/part-of: redacta
spec:
  background: false
  rules:
    - name: verify-redacta-acr-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.imageVerification.namespace | quote }}
      verifyImages:
        - imageReferences:
            - "{{ .Values.imageVerification.registry }}/redacta-*"
          failureAction: {{ .Values.imageVerification.failureAction | quote }}
          mutateDigest: true
          verifyDigest: true
          required: true
          imageRegistryCredentials:
            providers:
              - azure
          attestors:
            - count: 1
              entries:
                {{- range .Values.imageVerification.subjects }}
                - keyless:
                    issuer: {{ $.Values.imageVerification.issuer | quote }}
                    subject: {{ . | quote }}
                {{- end }}
{{- end }}
