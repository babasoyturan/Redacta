{{- if .Values.traefik.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "redacta-infra.fullname" . }}-traefik
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: traefik
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "redacta-infra.fullname" . }}-traefik
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "redacta-infra.fullname" . }}-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: {{ .Release.Namespace }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.traefik.ingressClass.name }}
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: "{{ .Values.traefik.image.repository }}:{{ .Values.traefik.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.traefik.image.pullPolicy }}
          args:
            - --entrypoints.web.address=:8000
            - --entrypoints.traefik.address=:8080
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass={{ .Values.traefik.ingressClass.name }}
            - --ping=true
            - --ping.entrypoint=traefik
          ports:
            - name: web
              containerPort: 8000
            - name: traefik
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: traefik
spec:
  type: {{ .Values.traefik.service.type }}
  ports:
    - name: web
      port: {{ .Values.traefik.service.port }}
      targetPort: web
      {{- if and (eq .Values.traefik.service.type "NodePort") .Values.traefik.service.nodePort }}
      nodePort: {{ .Values.traefik.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: traefik
{{- end }}
