{{- if .Values.keycloak.enabled }}
{{- if .Values.keycloak.realmImport.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.keycloak.service.name }}-realm
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  realm.json: |
{{ .Values.keycloak.realmImport.content | indent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.keycloak.service.name }}
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: keycloak
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.keycloak.image.pullPolicy }}
          args:
            - start-dev
            {{- if .Values.keycloak.realmImport.enabled }}
            - --import-realm
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.keycloak.service.port }}
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://{{ .Values.keycloak.database.host }}:{{ .Values.keycloak.database.port }}/{{ .Values.keycloak.database.name }}"
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.database.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.database.passwordSecretName }}
                  key: {{ .Values.keycloak.database.passwordSecretKey }}
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.secretName }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.secretName }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
            - name: KC_HEALTH_ENABLED
              value: "true"
          {{- if .Values.keycloak.realmImport.enabled }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      {{- if .Values.keycloak.realmImport.enabled }}
      volumes:
        - name: realm-import
          configMap:
            name: {{ .Values.keycloak.service.name }}-realm
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.keycloak.service.name }}
  labels:
    {{- include "redacta-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
{{- end }}
