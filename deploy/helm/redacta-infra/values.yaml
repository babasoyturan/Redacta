global:
  imagePullPolicy: IfNotPresent

secrets:
  create: false
  name: redacta-infra-secrets
  values:
    postgresPassword: ""
    keycloakAdminUsername: ""
    keycloakAdminPassword: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: ""
  service:
    name: postgres
    port: 5432
  auth:
    username: redacta
    database: postgres
    passwordSecretName: redacta-infra-secrets
    passwordSecretKey: postgres-password
  databases:
    - keycloak
    - redacta_documents
    - redacta_authentication
    - redacta_anonymization
  persistence:
    enabled: true
    size: 2Gi

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: 22.0.3
    pullPolicy: ""
  service:
    name: keycloak
    port: 8080
  database:
    host: postgres
    port: 5432
    name: keycloak
    username: redacta
    passwordSecretName: redacta-infra-secrets
    passwordSecretKey: postgres-password
  admin:
    secretName: redacta-infra-secrets
    usernameKey: keycloak-admin-username
    passwordKey: keycloak-admin-password
  realmImport:
    enabled: false
    content: ""

traefik:
  enabled: true
  image:
    repository: traefik
    tag: v3.0
    pullPolicy: ""
  ingressClass:
    name: traefik
  service:
    type: LoadBalancer
    port: 80
