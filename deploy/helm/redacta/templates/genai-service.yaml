{{- $anonymizationUrl := .Values.genaiService.anonymizationServiceUrl -}}
{{- if not $anonymizationUrl -}}
{{- $anonymizationUrl = printf "http://%s-anonymization-service:%d/api/v1/anonymization" (include "redacta.fullname" .) (int .Values.anonymizationService.service.port) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redacta.fullname" . }}-genai-service
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai-service
spec:
  {{- if not (and .Values.autoscaling.enabled .Values.autoscaling.components.genaiService) }}
  replicas: {{ .Values.genaiService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: genai-service
  template:
    metadata:
      labels:
        {{- include "redacta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: genai-service
        {{- include "redacta.workloadIdentityLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name (index .Values.serviceAccount.components "genaiService") }}
      serviceAccountName: {{ include "redacta.componentServiceAccountName" (dict "root" . "component" "genaiService") }}
      {{- end }}
      containers:
        - name: genai-service
          image: "{{ .Values.genaiService.image.repository }}:{{ .Values.genaiService.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.genaiService.image.pullPolicy }}
          {{- include "redacta.defaultContainerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.genaiService.service.port }}
          env:
            - name: ANONYMIZATION_SERVICE_URL
              value: {{ $anonymizationUrl | quote }}
            - name: GENAI_LOCAL_FALLBACK
              value: {{ .Values.genaiService.localFallback | quote }}
            - name: GENAI_OPENAI_MODEL
              value: {{ .Values.genaiService.openaiModel | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "genaiService") }}
                  key: openai-api-key
          {{- include "redacta.secretVolumeMounts" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.genaiService.resources | nindent 12 }}
      {{- include "redacta.secretVolumes" (dict "root" . "component" "genaiService") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redacta.fullname" . }}-genai-service
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.genaiService.service.port }}
      targetPort: http
  selector:
    {{- include "redacta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: genai-service
