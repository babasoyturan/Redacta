{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "redacta.fullname" . }}
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/v1/documents
            pathType: Prefix
            backend:
              service:
                name: {{ include "redacta.fullname" . }}-document-service
                port:
                  name: http
          - path: /api/v1/authentication
            pathType: Prefix
            backend:
              service:
                name: {{ include "redacta.fullname" . }}-authentication-service
                port:
                  name: http
          - path: /api/v1/anonymization
            pathType: Prefix
            backend:
              service:
                name: {{ include "redacta.fullname" . }}-anonymization-service
                port:
                  name: http
          - path: /api/v1/genai
            pathType: Prefix
            backend:
              service:
                name: {{ include "redacta.fullname" . }}-genai-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "redacta.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
