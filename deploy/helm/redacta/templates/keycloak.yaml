{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.keycloak.service.name }}
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "redacta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
        {{- include "redacta.workloadIdentityLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name (index .Values.serviceAccount.components "keycloak") }}
      serviceAccountName: {{ include "redacta.componentServiceAccountName" (dict "root" . "component" "keycloak") }}
      {{- end }}
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.keycloak.image.pullPolicy }}
          args:
            - start
          ports:
            - name: http
              containerPort: {{ .Values.keycloak.service.port }}
          env:
            - name: KC_DB
              value: {{ .Values.keycloak.database.vendor | quote }}
            - name: KC_DB_URL
              value: {{ .Values.keycloak.database.url | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "keycloak") }}
                  key: {{ .Values.keycloak.database.usernameSecretKey }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "keycloak") }}
                  key: {{ .Values.keycloak.database.passwordSecretKey }}
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "keycloak") }}
                  key: {{ .Values.keycloak.admin.usernameSecretKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "keycloak") }}
                  key: {{ .Values.keycloak.admin.passwordSecretKey }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: {{ .Values.keycloak.httpEnabled | quote }}
            - name: KC_HOSTNAME_STRICT
              value: {{ .Values.keycloak.hostnameStrict | quote }}
            - name: KC_PROXY
              value: {{ .Values.keycloak.proxy | quote }}
            - name: KC_TRANSACTION_XA_ENABLED
              value: {{ .Values.keycloak.transactionXaEnabled | quote }}
          {{- include "redacta.secretVolumeMounts" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      {{- include "redacta.secretVolumes" (dict "root" . "component" "keycloak") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.keycloak.service.name }}
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
  selector:
    {{- include "redacta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
{{- end }}
