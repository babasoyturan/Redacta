{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-default-deny-ingress
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-allow-frontend-from-app-gateway
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingress.appGatewayCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
---
apiVersion: networking.k8s.io/v1
