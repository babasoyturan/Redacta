{{- if .Values.networkPolicy.egress.externalHttpsCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-allow-genai-external-https
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: genai-service
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.egress.externalHttpsCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if .Values.networkPolicy.egress.sqlCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-allow-sql-egress
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "redacta.name" . | quote }}
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name | quote }}
      - key: app.kubernetes.io/component
        operator: In
        values:
          - document-service
          - authentication-service
          - anonymization-service
          - keycloak
          - sql-bootstrap
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.egress.sqlCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 1433
        - protocol: TCP
          port: 11000
          endPort: 11999
{{- end }}
---
apiVersion: networking.k8s.io/v1
