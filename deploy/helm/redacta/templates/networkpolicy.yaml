{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-app-ingress
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "redacta.selectorLabels" . | nindent 14 }}
    {{- range .Values.networkPolicy.ingress.appGatewayCidrs }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
{{- end }}
