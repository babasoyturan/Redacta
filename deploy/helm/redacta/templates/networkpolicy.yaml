{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-default-deny
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-allow-dns-egress
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-allow-frontend-from-app-gateway
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingress.appGatewayCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-allow-frontend-to-backends
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "redacta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: authentication-service
      ports:
        - protocol: TCP
          port: {{ .Values.authenticationService.service.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "redacta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: document-service
      ports:
        - protocol: TCP
          port: {{ .Values.documentService.service.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "redacta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: anonymization-service
      ports:
        - protocol: TCP
          port: {{ .Values.anonymizationService.service.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "redacta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: genai-service
      ports:
        - protocol: TCP
          port: {{ .Values.genaiService.service.port }}
---
