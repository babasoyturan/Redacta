{{- if .Values.monitoring.serviceMonitor.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redacta.fullname" . }}-allow-azure-monitor-scrapes
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "redacta.name" . | quote }}
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name | quote }}
      - key: app.kubernetes.io/component
        operator: In
        values:
          - document-service
          - authentication-service
          - anonymization-service
          - genai-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              rsName: ama-metrics
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              dsName: ama-metrics-node
      ports:
        - protocol: TCP
          port: {{ .Values.documentService.service.port }}
        - protocol: TCP
          port: {{ .Values.authenticationService.service.port }}
        - protocol: TCP
          port: {{ .Values.anonymizationService.service.port }}
        - protocol: TCP
          port: {{ .Values.genaiService.service.port }}
{{- end }}
{{- end }}
