apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redacta.fullname" . }}-document-service
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
spec:
  {{- if not (and .Values.autoscaling.enabled .Values.autoscaling.components.documentService) }}
  replicas: {{ .Values.documentService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: document-service
  template:
    metadata:
      labels:
        {{- include "redacta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: document-service
        {{- include "redacta.workloadIdentityLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name (index .Values.serviceAccount.components "documentService") }}
      serviceAccountName: {{ include "redacta.componentServiceAccountName" (dict "root" . "component" "documentService") }}
      {{- end }}
      containers:
        - name: document-service
          image: "{{ .Values.documentService.image.repository }}:{{ .Values.documentService.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.documentService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.documentService.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profile | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.documentService.databaseUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "documentService") }}
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "documentService") }}
                  key: datasource-password
            - name: STORAGE_LOCATION
              value: {{ .Values.documentService.storageLocation | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ .Values.documentService.jwtIssuerUri | quote }}
          {{- include "redacta.secretVolumeMounts" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 18
          resources:
            {{- toYaml .Values.documentService.resources | nindent 12 }}
      {{- include "redacta.secretVolumes" (dict "root" . "component" "documentService") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redacta.fullname" . }}-document-service
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.documentService.service.port }}
      targetPort: http
  selector:
    {{- include "redacta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
