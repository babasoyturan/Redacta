{{- if .Values.keyVault.csi.enabled }}
{{- range $component := list "documentService" "authenticationService" "anonymizationService" "genaiService" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "redacta.secretProviderClassName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "redacta.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | kebabcase }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "redacta.componentSecretName" (dict "root" $ "component" $component) }}
      type: Opaque
      data:
        {{- if or (eq $component "documentService") (eq $component "authenticationService") (eq $component "anonymizationService") }}
        - objectName: {{ $.Values.keyVault.csi.objects.datasourceUsername }}
          key: datasource-username
        - objectName: {{ $.Values.keyVault.csi.objects.datasourcePassword }}
          key: datasource-password
        {{- end }}
        {{- if eq $component "authenticationService" }}
        - objectName: {{ $.Values.keyVault.csi.objects.keycloakClientSecret }}
          key: keycloak-client-secret
        - objectName: {{ $.Values.keyVault.csi.objects.keycloakAdminUsername }}
          key: keycloak-admin-username
        - objectName: {{ $.Values.keyVault.csi.objects.keycloakAdminPassword }}
          key: keycloak-admin-password
        {{- end }}
        {{- if eq $component "genaiService" }}
        - objectName: {{ $.Values.keyVault.csi.objects.openaiApiKey }}
          key: openai-api-key
        {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ include "redacta.workloadIdentityClientId" (dict "root" $ "component" $component) | quote }}
    keyvaultName: {{ $.Values.keyVault.csi.vaultName | quote }}
    tenantId: {{ $.Values.keyVault.csi.tenantId | quote }}
    objects: |
      array:
        {{- if or (eq $component "documentService") (eq $component "authenticationService") (eq $component "anonymizationService") }}
        - |
          objectName: {{ $.Values.keyVault.csi.objects.datasourceUsername }}
          objectType: secret
        - |
          objectName: {{ $.Values.keyVault.csi.objects.datasourcePassword }}
          objectType: secret
        {{- end }}
        {{- if eq $component "authenticationService" }}
        - |
          objectName: {{ $.Values.keyVault.csi.objects.keycloakClientSecret }}
          objectType: secret
        - |
          objectName: {{ $.Values.keyVault.csi.objects.keycloakAdminUsername }}
          objectType: secret
        - |
          objectName: {{ $.Values.keyVault.csi.objects.keycloakAdminPassword }}
          objectType: secret
        {{- end }}
        {{- if eq $component "genaiService" }}
        - |
          objectName: {{ $.Values.keyVault.csi.objects.openaiApiKey }}
          objectType: secret
        {{- end }}
{{- end }}
{{- end }}
