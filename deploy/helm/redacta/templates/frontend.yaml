apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redacta.fullname" . }}-frontend
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not (and .Values.autoscaling.enabled .Values.autoscaling.components.frontend) }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  {{- include "redacta.deploymentStrategy" (dict "root" . "component" "frontend") | nindent 2 }}
  selector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "redacta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "redacta.topologySpreadConstraints" (dict "root" . "component" "frontend") | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.frontend.image.pullPolicy }}
          {{- include "redacta.defaultContainerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redacta.fullname" . }}-frontend
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
  selector:
    {{- include "redacta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
