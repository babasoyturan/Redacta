apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redacta.fullname" . }}-authentication-service
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentication-service
spec:
  {{- if not (and .Values.autoscaling.enabled .Values.autoscaling.components.authenticationService) }}
  replicas: {{ .Values.authenticationService.replicaCount }}
  {{- end }}
  {{- include "redacta.deploymentStrategy" (dict "root" . "component" "authenticationService") | nindent 2 }}
  selector:
    matchLabels:
      {{- include "redacta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: authentication-service
  template:
    metadata:
      labels:
        {{- include "redacta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: authentication-service
        {{- include "redacta.workloadIdentityLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name (index .Values.serviceAccount.components "authenticationService") }}
      serviceAccountName: {{ include "redacta.componentServiceAccountName" (dict "root" . "component" "authenticationService") }}
      {{- end }}
      {{- include "redacta.topologySpreadConstraints" (dict "root" . "component" "authentication-service") | nindent 6 }}
      containers:
        - name: authentication-service
          image: "{{ .Values.authenticationService.image.repository }}:{{ .Values.authenticationService.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.authenticationService.image.pullPolicy }}
          {{- include "redacta.defaultContainerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.authenticationService.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profile | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.authenticationService.databaseUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "authenticationService") }}
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "authenticationService") }}
                  key: datasource-password
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: {{ .Values.keycloak.authServerUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "authenticationService") }}
                  key: keycloak-client-secret
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.keycloak.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "authenticationService") }}
                  key: keycloak-admin-username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redacta.componentSecretName" (dict "root" . "component" "authenticationService") }}
                  key: keycloak-admin-password
          {{- include "redacta.secretVolumeMounts" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 18
          resources:
            {{- toYaml .Values.authenticationService.resources | nindent 12 }}
      {{- include "redacta.secretVolumes" (dict "root" . "component" "authenticationService") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redacta.fullname" . }}-authentication-service
  labels:
    {{- include "redacta.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentication-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.authenticationService.service.port }}
      targetPort: http
  selector:
    {{- include "redacta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: authentication-service
