global:
  imagePullPolicy: IfNotPresent

spring:
  profile: cloud

frontend:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-frontend
    tag: replace-me
  replicaCount: 1

documentService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-document-service
    tag: replace-me
  replicaCount: 1
  storageLocation: /mnt/redacta-documents
  databaseUrl: jdbc:sqlserver://sql-redacta-dev-7t9.database.windows.net:1433;database=documentdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
  jwtIssuerUri: https://dev.redacta.example.com/realms/oopsops

authenticationService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-authentication-service
    tag: replace-me
  replicaCount: 1
  databaseUrl: jdbc:sqlserver://sql-redacta-dev-7t9.database.windows.net:1433;database=authdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

anonymizationService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-anonymization-service
    tag: replace-me
  replicaCount: 1
  databaseUrl: jdbc:sqlserver://sql-redacta-dev-7t9.database.windows.net:1433;database=anonymizationdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
  jwtIssuerUri: https://dev.redacta.example.com/realms/oopsops

genaiService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-genai-service
    tag: replace-me
  replicaCount: 1
  localFallback: false

keycloak:
  enabled: true
  authServerUrl: http://keycloak:8080
  database:
    vendor: mssql
    url: jdbc:sqlserver://sql-redacta-dev-7t9.database.windows.net:1433;database=keycloakdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

serviceAccount:
  create: true
  components:
    documentService: redacta-document-service
    authenticationService: redacta-authentication-service
    anonymizationService: redacta-anonymization-service
    genaiService: redacta-genai-service
    keycloak: redacta-keycloak

workloadIdentity:
  enabled: true
  clientIds:
    documentService: 413ffcff-84fe-49ad-8289-991281499f07
    authenticationService: 1b63cbd7-93ff-421b-8259-41ae478e4683
    anonymizationService: 38c1a761-67e3-43b1-8882-c6a675d9bd86
    genaiService: 1f79720a-d52f-478d-a541-62c1c7f4ccee
    keycloak: 5c937b47-e60f-442f-8936-14564ddb7175

keyVault:
  csi:
    enabled: true
    vaultName: kv-redacta-dev-swec
    tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3

secrets:
  create: false
  name: redacta-app-secrets
  names:
    documentService: redacta-document-service-secrets
    authenticationService: redacta-authentication-service-secrets
    anonymizationService: redacta-anonymization-service-secrets
    genaiService: redacta-genai-service-secrets
    keycloak: redacta-keycloak-secrets

ingress:
  enabled: true
  className: azure-application-gateway
  host: dev.redacta.example.com
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/use-private-ip: "false"

autoscaling:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
