global:
  imagePullPolicy: IfNotPresent

spring:
  profile: cloud

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

frontend:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-frontend
    tag: replace-me
  replicaCount: 1

documentService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-document-service
    tag: replace-me
  replicaCount: 1
  storageLocation: /mnt/redacta-documents
  persistence:
    enabled: true
    storageClassName: azurefile-csi
    size: 20Gi
    shareName: redacta-documents
    resourceGroupName: rg-redacta-production
    storageAccountName: stredactaprod7t9
    secretName: redacta-azure-files-secret
    reclaimPolicy: Retain
  databaseUrl: jdbc:sqlserver://sql-redacta-prod-7t9.database.windows.net:1433;database=documentdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
  jwtIssuerUri: http://keycloak:8080/realms/oopsops

authenticationService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-authentication-service
    tag: replace-me
  replicaCount: 1
  databaseUrl: jdbc:sqlserver://sql-redacta-prod-7t9.database.windows.net:1433;database=authdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

anonymizationService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-anonymization-service
    tag: replace-me
  replicaCount: 1
  databaseUrl: jdbc:sqlserver://sql-redacta-prod-7t9.database.windows.net:1433;database=anonymizationdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
  jwtIssuerUri: http://keycloak:8080/realms/oopsops

genaiService:
  image:
    repository: acrredacta7t9.azurecr.io/redacta-genai-service
    tag: replace-me
  replicaCount: 1
  localFallback: false

keycloak:
  enabled: true
  authServerUrl: http://keycloak:8080
  database:
    vendor: mssql
    url: jdbc:sqlserver://sql-redacta-prod-7t9.database.windows.net:1433;database=keycloakdb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

serviceAccount:
  create: true
  components:
    documentService: redacta-document-service
    authenticationService: redacta-authentication-service
    anonymizationService: redacta-anonymization-service
    genaiService: redacta-genai-service
    keycloak: redacta-keycloak

workloadIdentity:
  enabled: true
  clientIds:
    documentService: 7331160a-c1ce-4ece-a261-da6b191d65aa
    authenticationService: ca0544ab-5771-4559-8616-e7bd381b91a6
    anonymizationService: 3f4eb19e-8143-46ea-a984-38c3cd37fe9b
    genaiService: 76373d03-86f8-4b30-9cf9-7c0631a3dfaa
    keycloak: 973c34c8-a295-4b95-b962-199e01105b24

keyVault:
  csi:
    enabled: true
    vaultName: kv-redacta-prod-swec
    tenantId: 84f58ce9-43c8-4932-b908-591a8a3007d3

sqlBootstrap:
  enabled: true
  serverFqdn: sql-redacta-prod-7t9.database.windows.net

secrets:
  create: false
  name: redacta-app-secrets
  names:
    documentService: redacta-document-service-secrets
    authenticationService: redacta-authentication-service-secrets
    anonymizationService: redacta-anonymization-service-secrets
    genaiService: redacta-genai-service-secrets
    keycloak: redacta-keycloak-secrets

ingress:
  enabled: true
  className: azure-application-gateway
  host: redacta.site
  annotations:
    appgw.ingress.kubernetes.io/use-private-ip: "false"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: redacta-tls

certManager:
  clusterIssuer:
    enabled: true
    name: letsencrypt-prod
    email: admin@redacta.site
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretName: redacta-letsencrypt-prod-account-key
    ingressClassName: azure-application-gateway

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  components:
    frontend: true
    documentService: true
    authenticationService: true
    anonymizationService: true
    genaiService: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  components:
    frontend: true
    documentService: true
    authenticationService: true
    anonymizationService: true
    genaiService: true

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

networkPolicy:
  enabled: true
  ingress:
    appGatewayCidrs:
      - 10.30.16.0/24

monitoring:
  serviceMonitor:
    enabled: true
    apiVersion: azmonitoring.coreos.com/v1
